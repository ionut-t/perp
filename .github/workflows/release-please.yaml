name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  GO_VERSION: "1.27.3"

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    env:
      VERSION: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Run tests
        run: go test -race ./...

      - name: Build binaries
        run: |
          mkdir -p dist

          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%d/%m/%Y)
          LDFLAGS="-X 'github.com/ionut-t/perp/internal/version.version=$VERSION' -X 'github.com/ionut-t/perp/internal/version.commit=$COMMIT' -X 'github.com/ionut-t/perp/internal/version.date=$BUILD_DATE'"

          # macOS (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/perp-darwin-arm64
          # macOS (Intel)
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/perp-darwin-amd64
          # Linux (64-bit)
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/perp-linux-amd64
          # Windows (64-bit)
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/perp-windows-amd64.exe

          chmod +x dist/*
          (cd dist && sha256sum * > checksums.txt)

      - name: Upload release artifacts
        run: gh release upload "$VERSION" dist/* --clobber

      - name: Append installation instructions to release notes
        run: |
          gh release view "$VERSION" --json body -q .body > notes.md

          cat >> notes.md <<NOTES

          ---

          ## Installation

          ### macOS (Apple Silicon)
          \`\`\`bash
          curl -L https://github.com/${{ github.repository }}/releases/download/${VERSION}/perp-darwin-arm64 -o perp && chmod +x perp
          \`\`\`

          ### macOS (Intel)
          \`\`\`bash
          curl -L https://github.com/${{ github.repository }}/releases/download/${VERSION}/perp-darwin-amd64 -o perp && chmod +x perp
          \`\`\`

          ### Linux
          \`\`\`bash
          curl -L https://github.com/${{ github.repository }}/releases/download/${VERSION}/perp-linux-amd64 -o perp && chmod +x perp
          \`\`\`

          ### For macOS and Linux
          \`\`\`bash
          sudo mv perp /usr/local/bin/
          # or
          mkdir -p ~/bin && mv perp ~/bin/ && echo 'export PATH="\$HOME/bin:\$PATH"' >> ~/.zshrc
          source ~/.zshrc
          \`\`\`

          ### Windows
          Download \`perp-windows-amd64.exe\` from the assets below.

          **Checksums:** see \`checksums.txt\` in the assets below.
          NOTES

          gh release edit "$VERSION" --notes-file notes.md
